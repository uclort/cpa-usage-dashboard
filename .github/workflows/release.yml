name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Install ARM64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Test
        run: go test ./...
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) cc=gcc ;;
              arm64) cc=aarch64-linux-gnu-gcc ;;
            esac
            out="dist/linux_${arch}"
            mkdir -p "$out"
            CGO_ENABLED=1 GOOS=linux GOARCH="$arch" CC="$cc" \
              go build -buildmode=c-shared -trimpath -ldflags='-s -w' \
              -o "$out/cpa-usage-dashboard.so" .
            rm -f "$out/cpa-quota-api-extension.h"
            (cd "$out" && zip -9 "../../release/cpa-usage-dashboard_${version}_linux_${arch}.zip" cpa-usage-dashboard.so)
          done
          (cd release && sha256sum *.zip > checksums.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
